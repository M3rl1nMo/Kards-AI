<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KARDS AI Monitor</title>
<style>body{font:14px system-ui;margin:0;background:#10151c;color:#e9edf3}main{max-width:1150px;margin:auto;padding:24px}h1{margin:0 0 4px}.muted{color:#96a3b5}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card{background:#19212c;padding:14px;border-radius:8px}.v{font-size:25px;font-weight:700;margin-top:6px}.wide{grid-column:span 2}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #2a3442;text-align:left}canvas{width:100%;height:170px;background:#131a23}#diag{border-left:4px solid #50c878}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}</style>
<main><h1>KARDS AI · Live Monitor</h1><div class="muted" id="updated">Loading…</div><section class="grid"><div class="card"><div class="muted">阶段 / 设备</div><div class="v" id="phase">—</div></div><div class="card"><div class="muted">本轮进度</div><div class="v" id="progress">—</div></div><div class="card"><div class="muted">累计对局</div><div class="v" id="total">—</div></div><div class="card"><div class="muted">吞吐</div><div class="v" id="speed">—</div></div><div class="card"><div class="muted">胜率 / 胜负平</div><div class="v" id="win">—</div></div><div class="card"><div class="muted">训练样本</div><div class="v" id="samples">—</div></div><div class="card"><div class="muted">平均回合</div><div class="v" id="turns">—</div></div><div class="card"><div class="muted">当前 Loss</div><div class="v" id="loss">—</div></div><div class="card wide" id="diag"><b id="dlabel">训练诊断</b><div class="muted" id="ddetail"></div></div><div class="card wide"><b>Loss 趋势</b><canvas id="chart" width="600" height="170"></canvas></div></section><section class="card"><b>最近对局 / 打牌记录</b><div class="muted" id="gamesHint">对局详细事件将在下一轮训练开始后记录。</div><table><thead><tr><th>局</th><th>胜者</th><th>回合</th><th>已打出的牌</th></tr></thead><tbody id="games"></tbody></table></section></main>
<script>const $=id=>document.getElementById(id);function n(x,d='—'){return x??d}function draw(a){let c=$('chart'),x=c.getContext('2d'),v=a.map(z=>z.loss).filter(Boolean);x.clearRect(0,0,c.width,c.height);if(v.length<2)return;let lo=Math.min(...v),hi=Math.max(...v),r=hi-lo||1;x.strokeStyle='#50c878';x.lineWidth=2;x.beginPath();v.forEach((q,i)=>{let px=i*c.width/(v.length-1),py=c.height-12-(q-lo)/r*(c.height-24);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}async function refresh(){let d=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json()),m=d.latest||{},w=+m.wins||0,l=+m.losses||0,dr=+m.draws||0,g=w+l+dr;$('updated').textContent='自动刷新 · '+new Date().toLocaleTimeString();$('phase').textContent=n(m.label)+' / '+n(m.device);$('progress').textContent=m.completed_episodes?`${m.completed_episodes}/${m.requested_episodes}`:'—';$('total').textContent=n(m.total_episodes);$('speed').textContent=m.games_per_second?m.games_per_second.toFixed(3)+' 局/秒':m.updates_per_second?m.updates_per_second.toFixed(2)+' 更新/秒':'—';$('win').textContent=g?(w/g*100).toFixed(1)+'% · '+w+'/'+l+'/'+dr:'—';$('samples').textContent=n(m.examples??m.replay_examples);$('turns').textContent=n(m.average_turns);$('loss').textContent=m.loss?.toFixed(4)??'—';$('dlabel').textContent=d.diagnosis.label;$('ddetail').textContent=d.diagnosis.detail;draw(d.train);$('games').innerHTML=d.games.map(g=>`<tr><td>${g.game}</td><td>${g.winner}</td><td>${g.turns}</td><td>${(g.cards_played||[]).join(', ')}</td></tr>`).join('');if(d.games.length)$('gamesHint').textContent='';}refresh();setInterval(refresh,2000)</script></html>
